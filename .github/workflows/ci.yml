name: ci
on:
    push:
    pull_request:
    workflow_dispatch:
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                # each built natively (the server loads a native ONNX Runtime); no Intel Mac: macos-13 runners never start
                os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            # pulls from the dimos-nix-cache R2 bucket (where this pushes), then dimos-desktop.cachix.org (older builds)
            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      extra-substituters = https://pub-18ed8210d82a4563a7e7269c4ce48a1c.r2.dev https://dimos-desktop.cachix.org
                      extra-trusted-public-keys = dimos-nix-cache-1:f6JE9qRFzxGAbwEYBxRkB7LsSYvIVv9BXfhsRm0kqPk= dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ=
            - run: nix build .#dimosApp -L
            # on a push to the default branch or a tag: pushes what Desktop installs to the R2 cache and fails unless it's there
            - if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
              run: |
                  out=$(readlink -f result)
                  key=$(mktemp) && printf '%s' "$NIX_SIGNING_KEY" > "$key"
                  nix copy --to "s3://dimos-nix-cache?endpoint=$R2_CACHE_ENDPOINT&region=auto&secret-key=$key" "$out"
                  rm -f "$key"
                  curl -sfI "https://pub-18ed8210d82a4563a7e7269c4ce48a1c.r2.dev/$(basename "$out" | cut -c1-32).narinfo" > /dev/null || { echo "::error::.#dimosApp ($out) isn't in the R2 cache"; exit 1; }
              env:
                  R2_CACHE_ENDPOINT: ${{ vars.R2_CACHE_ENDPOINT }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
            # dimos.yaml provides: is what the built server serves at openapi.json (the server prints it)
            - run: result/bin/dimos-app-server --openapi-json > /dev/null
            # dimos.yaml's version is the app's own, so the crate's has to say the same (it is what a recording's
            # app_version and the startup log line are)
            - run: scripts/check_version.sh
            # the page's deno: the version the flake builds it with (nixos-25.11's), whose deno.lock this is
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.6.10
            - run: deno install --frozen && deno task typecheck
              working-directory: frontend
