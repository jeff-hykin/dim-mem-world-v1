name: ci
on:
    push:
    pull_request:
    workflow_dispatch:
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                # each built natively (the server loads a native ONNX Runtime); no Intel Mac: macos-13 runners never start
                os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31
            # pulls from dimos-desktop.cachix.org; pushes what it builds only when the CACHIX_AUTH_TOKEN secret is set
            - uses: cachix/cachix-action@v16
              with:
                  name: dimos-desktop
                  authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
            - run: nix build .#dimosApp -L
            # dimos.yaml lists exactly what the built server serves at agent.json
            - run: result/bin/dimos-app-server --agent-json > /dev/null
