[package]
name = "dimos-app-server"
version = "0.1.0"
edition = "2021"
description = "Memory World's backend for dimOS Desktop"
license = "Apache-2.0"

[[bin]]
name = "dimos-app-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dimos-recording = { path = "../crates/dimos-recording" }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
memworld = { path = "../crates/memworld" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_yaml = "0.9"
